<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Карточки товара</title>
</head>

<body>

  <ul class="products">
    <li class="products__item">
      <article class="product">
        <img src="img/NovaX.png" alt="Nova X" class="product__pic">
        <h3 class="product__title">
          <a href="#" target="_blank" class="product__link">
            Nova X
          </a>
        </h3>
        <p class="product__descr">OLED-дисплей и двойная камера</p>
        <div class="product__bottom">
          <div class="product__price">49 990 ₽</div>
          <button type="button" class="product__btn">Купить</button>
        </div>
      </article>
    </li>
    <li class="products__item">
      <article class="product">
        <img src="img/SonicPro.png" alt="Sonic Pro" class="product__pic">
        <h3 class="product__title">
          <a href="#" target="_blank" class="product__link">
            Sonic Pro
          </a>
        </h3>
        <p class="product__descr">Полноразмерные беспроводные наушники с активным шумоподавлением, поддержкой
          быстрой зарядки и автономностью до 40 часов</p>
        <div class="product__bottom">
          <div class="product__price">12 490 ₽</div>
          <button type="button" class="product__btn">Купить</button>
        </div>
      </article>
    </li>
    <li class="products__item">
      <article class="product">
        <img src="img/PulseWatch.png" alt="Pulse Watch" class="product__pic">
        <h3 class="product__title">
          <a href="#" target="_blank" class="product__link">
            Pulse Watch
          </a>
        </h3>
        <p class="product__descr">Умные часы для спорта и отслеживания активности</p>
        <div class="product__bottom">
          <div class="product__price">18 990 ₽</div>
          <button type="button" class="product__btn">Купить</button>
        </div>
      </article>
    </li>
  </ul>

</body>

</html>
