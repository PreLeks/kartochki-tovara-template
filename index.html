<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Карточки товара</title>
</head>

<body>

  <section class="cards">
    <div class="cards__content">
        <article class="cards__item">
          <div class="cards__description">
            <img src="img/NovaX.png" alt="Nova X" class="cards__image">
            <h3 class="cards__title">Nova X</h3>
            <p class="cards__subtitle">OLED-дисплей и двойная камера</p>
          </div>
          <div class="cards__price">
            <span class="cards__price-value">49 990 ₽</span>
            <button type="button" class="cards__button">Купить</button>
          </div>
        </article>

        <article class="cards__item">
          <div class="cards__description">
            <img src="img/SonicPro.png" alt="Sonic Pro" class="cards__image">
            <h3 class="cards__title">Sonic Pro</h3>
            <p class="cards__subtitle">Полноразмерные беспроводные наушники с активным шумоподавлением, поддержкой
              быстрой зарядки и автономностью до 40 часов</p>
          </div>
          <div class="cards__price">
            <span class="cards__price-value">12 490 ₽</span>
            <button type="button" class="cards__button">Купить</button>
          </div>
        </article>

        <article class="cards__item">
          <div class="cards__description">
            <img src="img/PulseWatch.png" alt="Pulse Watch" class="cards__image">
            <h3 class="cards__title">Pulse Watch</h3>
            <p class="cards__subtitle">Умные часы для спорта и отслеживания активности</p>
          </div>
          <div class="cards__price">
            <span class="cards__price-value">18 990 ₽</span>
            <button type="button" class="cards__button">Купить</button>
          </div>
        </article>
    </div>
  </section>

</body>

</html>
